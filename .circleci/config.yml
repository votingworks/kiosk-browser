version: 2.1

orbs:
  node: circleci/node@6.3.0

jobs:
  test:
    machine:
      image: 'ubuntu-2204:current'
    steps:
      - checkout
      - node/install:
          node-version: '24.19'
          install-pnpm: true
      - node/install-packages:
          pkg-manager: pnpm
          cache-path: ~/.local/share/pnpm/store
      - run:
          name: Lint
          command: pnpm lint
      - run:
          name: Test APIs
          command: pnpm test:coverage
  enforce-version-bump:
    machine:
      image: 'ubuntu-2204:current'
    steps:
      - checkout
      - run:
          name: Install jq
          command: |
            sudo apt-get update -y
            sudo apt-get install -y jq
      - run:
          name: Fetch main
          command: |
            git fetch --no-tags --depth=1 origin main
      - run:
          name: Enforce version bump
          command: |
            set -euo pipefail

            BASE_BRANCH="origin/main"

            CURRENT_VERSION="$(jq -r '.version' package.json)"
            BASE_VERSION="$(git show ${BASE_BRANCH}:package.json 2>/dev/null | jq -r '.version')"

            echo "Base version:    ${BASE_VERSION}"
            echo "Current version: ${CURRENT_VERSION}"

            if [ "${BASE_VERSION}" = "${CURRENT_VERSION}" ]; then
              echo "ERROR: Changes detected but package.json version was not updated. Please bump the version."
              exit 1
            fi

            echo "Version changed; passing."

workflows:
  test:
    jobs:
      - test
      - enforce-version-bump:
          filters:
            branches:
              ignore:
                - main
